<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<canvas id="particles"></canvas>

<div class="card-wrapper">
  <div class="card" id="card">

    <div class="logo-area">
      <div class="logo-mark">▲</div>
      <h1>Iniciar Sesión</h1>
      <p class="tagline">Accede a tu cuenta</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label>Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input type="text" id="username" placeholder="Nombre de usuario" required>
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="togglePwd" title="Mostrar / ocultar contraseña">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          Recordarme
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
    </form>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let mouseX = -1000, mouseY = -1000;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() {
    this.reset();
    this.y = Math.random() * canvas.height;
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -10;
    this.size = Math.random() * 2.5 + 0.8;
    this.speedY = Math.random() * 0.5 + 0.2;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.15;
    this.hue = Math.random() < 0.3 ? 40 : Math.random() < 0.5 ? 10 : 30;
    this.flickerSpeed = Math.random() * 0.02 + 0.005;
    this.flicker = Math.random() * Math.PI * 2;
  }
  update() {
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.15;
    this.flicker += this.flickerSpeed;
    const distX = this.x - mouseX;
    const distY = this.y - mouseY;
    const dist = Math.sqrt(distX * distX + distY * distY);
    if (dist < 120) {
      this.x += (distX / dist) * 0.4;
      this.y += (distY / dist) * 0.4;
    }
    const opacityMod = Math.sin(this.flicker) * 0.15;
    this.currentOpacity = this.opacity + opacityMod;
    if (this.y > canvas.height + 15) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 60%, 55%, ${Math.max(0, this.currentOpacity)})`;
    ctx.fill();
    ctx.shadowColor = `hsla(${this.hue}, 80%, 50%, ${Math.max(0, this.currentOpacity * 0.6)})`;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

for (let i = 0; i < 90; i++) particles.push(new Particle());

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();

// ── 3D card tilt ──
const card = document.getElementById('card');
const wrapper = document.querySelector('.card-wrapper');

wrapper.addEventListener('mousemove', e => {
  const rect = wrapper.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width / 2;
  const y = e.clientY - rect.top - rect.height / 2;
  const rotateY = (x / rect.width) * 11;
  const rotateX = -(y / rect.height) * 11;
  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  card.style.boxShadow = `
    ${-rotateY * 2}px ${rotateX * 2}px 80px rgba(120, 90, 30, 0.18),
    0 0 140px rgba(140, 30, 30, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.03)
  `;
});
wrapper.addEventListener('mouseleave', () => {
  card.style.transform = 'rotateX(0deg) rotateY(0deg)';
  card.style.boxShadow = '0 0 80px rgba(120, 90, 30, 0.18), 0 0 140px rgba(140, 30, 30, 0.08), inset 0 1px 0 rgba(255,255,255,0.03)';
});

// ── Toggle password visibility ──
const pwdInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePwd');
toggleBtn.addEventListener('click', () => {
  const isPassword = pwdInput.type === 'password';
  pwdInput.type = isPassword ? 'text' : 'password';
  toggleBtn.innerHTML = isPassword
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
});

// ── Toast ──
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── Form submit ──
const form = document.getElementById('loginForm');
const btn = document.getElementById('btnLogin');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username) return showToast('El usuario es obligatorio', 'error');
  if (!password) return showToast('La contraseña es obligatoria', 'error');

  btn.classList.add('loading');

  try {
    const res = await fetch('https://jmfortiz.jasodev.es/webhook/eed310bd-4bf2-4aba-b911-c9014db4fa83', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || data.error || 'Credenciales inválidas');
    }

    const token = data.token || data.jwt || data.access_token || data.accessToken;
    if (!token) {
      showToast('El servidor no devolvió un token válido', 'error');
      return;
    }

    localStorage.setItem('jwt', token);
    localStorage.setItem('user', JSON.stringify(data.user || data.usuario || { username }));

    showToast(`Sesión iniciada como "${username}"`, 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);

  } catch (err) {
    btn.classList.remove('loading');
    showToast(err.message || 'Error de conexión', 'error');
  }
});
</script>

</body>
</html>
